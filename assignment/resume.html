<!DOCTYPE html>
<html>
<head>
<title>Resume</title>
<style>
  .h1{text-align:center; }
  body {font-family: Arial; padding:20px;}
  .box {border:1px solid #ccc; padding:15px; margin-bottom:20px;}
  h2 {margin:0; color:#2b6cb0;}
  ul {margin:5px 0 0 20px;}
  table {width:100%; border-collapse: collapse; margin-top:10px;}
  table, th, td {border:1px solid #999; padding:8px;}
</style>
</head>
<body>
    <h1>My Resume</h1>

<div class="box">
  <h2>Your Name</h2>
  <p>Email: you@example.com | Phone: 99999 99999</p>
</div>

<div class="box">
  <h3>Skills</h3>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>C++</li>
  </ul>
</div>


<div class="box">
  <h3>Education</h3>
  <table>
    <tr><th>Course</th><th>School/College</th><th>Year</th></tr>
    <tr><td>BSc CS</td><td>ABC College</td><td>2024</td></tr>
    <tr><td>12th</td><td>XYZ School</td><td>2021</td></tr>
  </table>
</div>

</body>
</html>
