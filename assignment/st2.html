<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Product Grid</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background: #f5f5f5;
padding: 20px;
}
h2 {
text-align: center;
margin-bottom: 20px;
}
.grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 20px;
}
.card {
background: #fff;
border-radius: 8px;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
padding: 55px;
text-align: center;
}
.card img {
width: 100%;
height: 150px;
object-fit: cover;
border-radius: 6px;
margin-bottom: 10px;
}
.card h3 {
font-size: 18px;
margin: 8px 0;
}
.card p {
font-size: 14px;
color: #555;
margin: 4px 0;
}
.price {
font-weight: bold;
color: #007bff;
}
@media (max-width: 1024px) {
.grid {
grid-template-columns: repeat(2, 1fr);
}
}
@media (max-width: 600px) {
.grid {
grid-template-columns: 1fr;
}
}
</style>
</head>
<body>
<h2>Responsive Product Grid</h2>
<div class="grid">
<div class="card">
<img src="https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.apple.com%2Fnewsroom%2F2025%2F09%2Fapple-debuts-iphone-17%2F&psig=AOvVaw0p7i3BZvVu-imxCZF5a_Gw&ust=1765514681946000&source=images&cd=vfe&opi=89978449&ved=0CBIQjRxqFwoTCKDElvDctJEDFQAAAAAdAAAAABAK" alt="i-Phone 17">
<h3>i-phone</h3>
<p>Premium design with powerful performance</p>
<p class="price">₹11,499</p>
</div>
<div class="card">
<img src="https://www.amazon.in/HP-14-inch-Laptop-Windows-14-cs1002TU/dp/B07TZK18HL" alt="Product 2">
<h3>HP PAVILLION</h3>
<p>Intel Core i5 Processor 8 256GB</p>
<p class="price">₹799</p>
</div>
<div class="card">
<img src="https://www.electrolux.in/support/faq/microwave-ovens/" alt="Product 3">
<h3>MICROWAVE</h3>
<p>20 Litre Capacity
800 Watt Power Output</p>
<p class="price">₹1,999</p>
</div>
<div class="card">
<img src="ac.jpg" alt="Product 4">
<h3>Product 4</h3>
<p>1.5 Ton Capacity
5 Star Energy Rating</p>
<p class="price">₹9999</p>
</div>
</div>
</body>
</html>
